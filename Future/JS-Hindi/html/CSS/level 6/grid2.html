<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid and its functions</title>
  <style>
    #container{
     
      display: grid;
      border: 2px solid red;
      background-color: aliceblue;
      grid-template-columns: 50px 50x;
      grid-template-rows: 50px 50px;
    }
    #item1{
     
      grid-column:1/2 ;
      grid-row: 1/2;
      background-color: rgb(195, 202, 207);
      margin: 5px;
    }
    #item2{
      
      grid-column: 2/2;
      grid-row: 1/2;
      background-color: antiquewhite;
      margin: 5px;
    }
    #item3{
       height: 50px;
      width: 50px;
      grid-column: 1/2;
      grid-row: 2/2;
      background-color: rgb(50, 90, 90);
      margin: 5px;
    }
    #item4{
       height: 50px;
      width: 50px;
      grid-row: 2/2;
      grid-column: 2/2;
      background-color: cyan;
      margin: 5px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="item1">item 1</div>
     <div id="item2">item 2</div>
      <div id="item3">item 3</div>
       <div id="item4">item 4</div>
  </div>
</body>
</html>
