<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text transform property</title>
    <style>
      *{
        margin: 0px;
        padding: 0px;
      }
      .box{
        margin: 10px;
      }
      #box1{
        text-transform: uppercase;
      }
      #box2{
        text-transform: lowercase;
      }
      #box3{
        text-transform: capitalize;
      }
      #box4{
        text-transform: none;
      }
    </style>
  </head>
  <body>
    <div id="box1" class="box">First box1</div>
    <div id="box2" class="box">Second box2</div>
    <div id="box3" class="box">Third box3</div>
    <div id="box4" class="box">Fourth box4</div>

  </body>
</html>
