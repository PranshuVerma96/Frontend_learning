<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox container justify content</title>
  <style>
    *{
      margin: 0px;
      padding: 0px;
    }
    #cont{
      text-align: center;

    }
    #container{
      height: 300px;
      width: 300px;
      border: 3px solid rebeccapurple;
      background-color: rgb(197, 217, 217);
      display: flex;
      justify-content: center;
     
     
    
       
    }
    .box{
      height: 80px;
      width: 80px;
      border: 2px solid black;
      margin: 10px;
      text-align: center;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
     
    }
    #item1{
      background-color: aliceblue;
    }
     #item2{
      background-color: rgb(56, 109, 155);
      
      flex-shrink: 5;
    }
     #item3{
      background-color: rgb(154, 26, 75);
    }
     #item4{
      background-color: rgba(95, 97, 99, 0.623);
    }
  </style>
</head>
<body>
  <h1 id="cont">container item</h1>
  <div id="container">
    <div id="item1" class="box">item1</div>
    <div id="item2" class="box">item2</div>
    <div id="item3" class="box">item3</div>
    <div id="item4" class="box">item4</div>
     
     
   
 
   
  </div>
</body>
</html>
