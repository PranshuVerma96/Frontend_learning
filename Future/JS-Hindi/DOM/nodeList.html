<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document chai aur code</title>
</head>
<body style="background-color: black; color:aliceblue">
  
</body>
<script>
 function createNewDiv(text ,backcol){
  const div = document.createElement('div')
  console.log(div)
  div.className = 'main'
  div.id = Math.round (Math.random()*10 +1)
  div.setAttribute('Title','generated title')
  div.style.backgroundColor  = (backcol || 'green')
  div.style.padding = '14px'
  div.style.margin = '4px'

  //div.innerHTML = 'papa'

  const addTxt = document.createTextNode(text || 'papa ki pari')
  div.appendChild(addTxt)

  document.body.appendChild(div)
 }
 createNewDiv()
  createNewDiv('peNAHU' ,'PINK')
   createNewDiv('sandesh' ,'yellow')
    createNewDiv('prience' ,'red')

</script>
</html>
