<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document and boxshadow</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    background-color: black;
  }

  div{
   
  border-radius: 50%;
    margin: auto;
    width: 300px;
    height: 300px;
    background-color: rgb(153, 60, 75);
    align-items: center;
    text-align: center;
    box-shadow: 0px 0px 50px 40px #ffb000;
  }
</style>
<body>
  <div>shadow</div>
</body>
</html>
