<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice set</title>
  <style>
    *{
      padding: 0px;
      margin: 0px;
    }
    .box{
      height: 90px;
      width: 90px;
    }
    #container{
      height: 500px;
      width: 500px;
      background-color: rgb(138, 172, 124);
      border: 2px solid gray;
      display: flex;
      justify-content: space-around;
    }
    #box1{
      background-color: antiquewhite;
      border: 2px solid red;
    }
     #box2{
      background-color: rgb(170, 132, 83);
      border: 2px solid rgb(21, 162, 175);
      flex-grow: 1;
    }
     #box3{
      background-color: rgb(108, 105, 101);
      border: 2px solid rgb(27, 21, 21);
    }
   

  </style>
</head>
<body>
  <div id="container">
    <div id="box1" class="box">box1</div>
    <div id="box2" class="box">box2</div>
    <div id="box3" class="box">box3</div>

  </div>
</body>
</html>
