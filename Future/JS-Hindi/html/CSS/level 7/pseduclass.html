<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pseudo classes</title>
  <style>
    button{
      height: 60px;
      width: 60x;
    }
    button:hover{
      background-color: pink;
      border: 2px solid green;
      border-radius: 10x ;
    }
    button:active{
      
      border:  2px solid red;
      background-color: aqua;
    }
  </style>
</head>
<body>
  <div id="div"><button>click Me</button></div>
</body>
</html>
