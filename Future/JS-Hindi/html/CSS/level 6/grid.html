<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid</title>
  <style>
    .container{
      display: grid;
      grid-template-columns: 50px 50px;
      grid-template-rows: 50px 5px;
    }
    .item1{
    
      grid-row: 1/2;
      grid-column: 1/2;
      background-color: lightblue;
    }
     .item2{
      
      grid-row: 2/2;
      grid-column: 1/2;
      background-color: rgb(30, 118, 147);
    }
     .item3{
      grid-row: 1/2;
      grid-column: 2/2;
      background-color: rgb(146, 29, 56);
    }
     .item4{
      grid-row: 2/2;
      grid-column: 2/2;
      background-color: rgb(33, 137, 111);
    }
    
  </style>
</head>
<body>
  <div id="container">
    <div class="item1">item 1</div>
    <div class="item2">item 2</div>
    <div class="item3">item 3</div>
    <div class="item4">item 4</div>
  </div>
</body>
</html>
