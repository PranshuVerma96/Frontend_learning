<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document transitions </title>
</head>
<style>
  .btn{
    width: 90px;
    height: 30px;
   transition:all 1s linear ;

  }
  .btn:hover{
      width: 150px;
      height: 40px;
      background-color: pink;
      color: firebrick;
      border: 2px solid red;
      border-radius: 3px;
      box-shadow: 2px 2px 15px ;

  }

</style>
<body>
 <h1>hello world</h1>
 <button class="btn">Google.com</button>
</body>
</html>
