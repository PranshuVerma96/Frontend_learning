<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gessing the number game</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
  <div class="container">
    <div class="heading1">Number Guessing Game</div>
    <div class="heading2">Try and guess a random number between 0 and 100</div>
    <div class="heading3">You have 10 attempts to guess the right Number</div>
    <div class="heading4">Guess a Number</div>
    <input type="text" class="input" placeholder="Please Enter numer "><br>
    <button type="submit" class="btn" id="subt">Sumit guess</button>
    <div class="resultParas">

       <div class="heading5">Previous Guesses : <span class="guesses"></span></div>
    <div class="heading6">Guesses Remaining : <span class="lastResult">10</span></div>
    <p class="lowOrHi"></p>
    </div>

   
  </div>
</body>
<script src="script.js"></script>
</html>
