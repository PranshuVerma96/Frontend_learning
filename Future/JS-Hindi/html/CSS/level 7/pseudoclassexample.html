<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pseudo classes</title>
  <style>
    .btn{
      height: 30px;
      width: 100px;
      border: 2px solid ;  
      background-color: aliceblue;
    }
    .btn:hover{
      background-color: red;
      border-radius: 3px;
    }
    .btn:active{
      height: 25px;
      width: 80px;
      border: 2px soild red;
      background-color: rgb(33, 158, 112);
    }
  </style>
</head>
<body>
  <button class="btn">Click Me</button>
</body>
</html>
