<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document and positions</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    background-color: rgb(78, 75, 75);
    position: relative;
  }
  .parent{
    width: 500px;
    height: 500px;
    background:linear-gradient(red ,blue);
    position: relative;
    left: 30px;
    margin-top: 150px;
  }
  .div1{
    margin: 5px;
    height: 80px;
    width: 80px;
    background-color: yellow;
    border: 3px sienna solid;
     position: absolute;
   
  }
  .div2{
    margin: 5px;
    height: 80px;
    width: 80px;
    background-color: yellow;
    border: 3px sienna solid;
     position: absolute;
     top: 0;
     right: 0;
  }

  .div3{
    margin: 5px;
    height: 80px;
    width: 80px;
    background-color: yellow;
    border: 3px sienna solid;
    position: absolute;
    bottom: 0;
    right: 0;
  }
  .div4{
    margin: 5px;
    height: 80px;
    width: 80px;
    background-color: yellow;
    border: 3px sienna solid;
     position: absolute;
     left: 0;
     bottom: 0;
  }
  .div5{
    margin: 5px;
    height: 80px;
    width: 80px;
    background-color: yellow;
    border: 3px sienna solid;
     position: absolute;
     left: 50%;
     top: 50%;
     transform: translate(-50%,-50%);
     
     
  }
 h1{
  text-align: center;
  margin: auto;
  padding: 20px;
  background-color: blue;
  margin-bottom: 25px;
  position: fixed;
  top: 0;
  
 }
 a{
 
 
 
  position: sticky;
  top: 50%;
 }
  
</style>
<body>
  <div><h1>Hello everyone</h1>
  
  <a href="#"> join what app now</a>
  </div>
  
  <div class="parent">
    <div class="div1">home 1</div>
    <div class="div2">papa 2</div>
    <div class="div3">mummy 3 </div>
    <div class="div4">Beta 4</div>
     <div class="div5">Bety 5</div>

  </div>
</body>
</html>
