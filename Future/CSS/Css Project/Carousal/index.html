<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>carousal effect</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body{
    height: 100vh;
    background-color: #191825;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  html{
    font-size: 62.5%;
  }
  .container-img{
    height: 400px;
    width: 600px;
    background-color: aliceblue;
    border-radius: 1rem;
    background-image: url('https://images.unsplash.com/photo-1766837774799-4d25916b1a8d?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
    background-size: cover;

    animation: gallery 20s linear infinite;


  }
  @keyframes gallery {
    0%{
background-image: url('https://plus.unsplash.com/premium_photo-1732730224458-4082b9285435?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
    }
    20%{
      background-image: url('https://images.unsplash.com/photo-1761839257469-96c78a7c2dd3?q=80&w=1469&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');

    }
    40%{
background-image: url('https://plus.unsplash.com/premium_photo-1661878115335-a1f2788b2f43?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
    }
    60%{
      background-image: url('https://images.unsplash.com/photo-1761839257864-c6ccab7238de?q=80&w=1471&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');

    }
    80%{

      background-image: url('https://images.unsplash.com/photo-1595707002923-80233bbb30f0?q=80&w=1507&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
    }
    100%{
      background-image: url('https://plus.unsplash.com/premium_photo-1747563651580-75e9fa01354f?q=80&w=1012&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');

    }

    
  }
</style>
<body>
  <div class="container-img"></div>
</body>
</html>
