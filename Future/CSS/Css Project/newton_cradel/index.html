<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document and newton cradle</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body{
    height: 100vh;
    display: grid;
    place-items: center;
    background-color: #191825;
  }


  .cradle{
    width: 30rem;
    height: 30rem;
    border-top: 2rem solid #865dff;
    border-radius: .5rem;
    justify-content: space-around;
    justify-content: center;
    display: flex;
    gap: 4.5rem;
    
  
  }

  .div{
    position: relative;
    width: .5rem;
    height: 20rem;
    background-color: #865dff;
  }
   .cradle div::before{
    content: "";
    position: absolute;
    bottom: 0;
    left: -2.5rem;
    width: 5rem;
    aspect-ratio: 1;
    border-radius: 50%;
    background-color: #865dff;
  }
  .cradle div:first-child{
    animation: left-swing 2s linear infinite;
    transform-origin: top left;
  }
  .cradle div:last-child{
    animation: right-swing 2s linear 1s infinite;
    transform-origin: top left;
  }
  @keyframes left-swing {
    0%{
      rotate: 0deg;
      
    }

    25%{
      rotate: 30deg;
    }
    50%{
      rotate:0deg ;
    }
    100%{
      rotate: 0deg;
    }
  }
  @keyframes right-swing {
    0%{
      rotate: 0deg;
      
    }

    25%{
      rotate: -30deg;
    }
    50%{
      rotate:0deg ;
    }
    100%{
      rotate: 0deg;
    }
  }
</style>

<body>
  
  <div class="cradle">
    <div class="div"></div>
    <div class="div"></div>
    <div class="div"></div>
    <div class="div"></div>
    <div class="div"></div>
  </div>
</body>
</html>
