<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document object model</title>
</head>
<body style="background-color: black; color:aliceblue">
  
  <ul class="language">
    <li>JavaScript</li>
  </ul>
</body>

<script>
  function addLanguage(langName){
   const li=   document.createElement('li')
   li.innerHTML = `${langName}`
   document.querySelector('.language').appendChild(li)

  }
  addLanguage('python')
  addLanguage('java')

  function addOptiLanguage(langName){
    const li = document.createElement('li')
    li.appendChild(document.createTextNode(langName))

    document.querySelector('.language').appendChild(li)

  }
  addOptiLanguage('C#')
  addOptiLanguage('papa ki pari')

  //Edit

const first = document.querySelector('li:nth-child(2)')
const newLi = document.createElement('li')
newLi.textContent = 'paki ki pari intelligent'
first.replaceWith(newLi)

const second = document.querySelector('li:nth-child(3)')
const list = document.createElement('li')
list.textContent = 'ma ka ladla'
second.replaceWith(list)

// edit

const Third =document.querySelector('li:first-child')
Third.outerHTML = '<li>TypeScript</li>'

//remove

const lastLanguage = document.querySelector('li:last-child')
lastLanguage.remove()
</script>
</html>
