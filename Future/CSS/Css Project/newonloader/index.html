<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document and newonloader</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html{
    font-size: 62.5%;
  }

  body{
    height: 100vh;
    display: grid;
    place-items: center;
    background-color: #191825;
  }
  .loader{
    position: relative;
    width: 20rem;
    background-color: #865dff;
    aspect-ratio: 1;
    border-radius: 50%;
    animation:  cirloder 1s linear infinite reverse;
  }
  @keyframes cirloder {
    100%{
      rotate: 360deg;
    }
    
  }
  .loader::before{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    aspect-ratio: 1;
    width: 17rem;
    border-radius: 50%;
    background-color: #191825;
  }
  .loader::after{
     content: "";
    position: absolute;
    top: -2.5rem;
    left: 8rem;
   
    aspect-ratio: 1;
    width: 5rem;
    border-radius: 50%;
    background-color:#865dff;
    box-shadow: 1px 1px 5rem #865dff;
    
  }

</style>
<body>
  <div class="loader"></div>
  
</body>
</html>
