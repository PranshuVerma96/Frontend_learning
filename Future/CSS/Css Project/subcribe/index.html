<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document and subcribe </title>
</head>
<style>
  *{
margin: 0;
padding: 0;
box-sizing: border-box;
  }
  body{
    height: 100vh;
    display: grid;
    place-items: center;
    background-color: #191725;
  }
  h1{
    text-align: center;
    text-transform: uppercase;
    color: #fff;
    font-weight: bold;
    font-size: 96px;
    font-size: 96px;
    text-shadow: -1px 2px 3px rgba(236, 247 , 79 , .2);
    position: relative;
  }

  h1::before{
    content: "Subscribe...";
    position: absolute;
    top: 0;
    left: 0;
    width: 0%;
    color: yellow;
    border-right: 2px solid yellow;
    overflow: hidden
    ;
    animation: texts 2s linear infinite alternate;

  }
  @keyframes texts{
0%{
  width: 0%;
}
100%{
  width: 100%;
}
  }
  
</style>
<body>
  
  <h1>Subscribe...</h1>
</body>
</html>
