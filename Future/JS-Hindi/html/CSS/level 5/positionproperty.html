<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position property</title>
  <style>
    *{
      padding: 0px;
      margin: 0px;
    }
    .box{
      height: 70px;
      width:70px;
      background-color: rebeccapurple;
      border: 5px solid pink;
      margin: 10px;

    }
    #box1{
      position: static;
    }
    #box2{
      position: relative;
      top: 20px;
      left: 90px;
    }
    #box3{
      position: fixed;
      top: 20px;
      left: 90px;
    }
    #box4{
      position: absolute;
      top: 200px;
      left: 200px;
    }
  </style>
</head>
<body>
  <div id="box1" class="box">Static</div>
  <div id="box2" class="box">Relative</div>
  <div id="box3" class="box">Fixed</div>
  <div id="box4" class="box">Absolute</div>
</body>
</html>
