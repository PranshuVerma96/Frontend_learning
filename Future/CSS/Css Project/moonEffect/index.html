<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>moon effect</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body{
    background-color: #ffe4de;
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
  }
  .universe{
    width: 40vw;
    aspect-ratio: 1;
    background-color:#ffbb5c ;
    display: grid;
    place-items: center;
    border-radius: 13px;
    animation: col 10s linear;
  }
  @keyframes col {
    0%{
      background-color: #ffbb5cb5;
    }
    25%{
      background-color: #fcbf49;
    }
    50%{
      background-color: #000;
    }
    75%{
      background-color: #fcbf49;
    }
    100%{
      background-color: #ffbb5cb5;
    }
  }
  .sun{
    width: 18vw;
    aspect-ratio: 1;
    background-color: #e25e3e;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;


    &::after{
      content: "";
      top: 0;
      left: 0;
      position: absolute;
      width: inherit;
      aspect-ratio: 1;
      background-color: #000;
      border-radius: inherit;
      animation: moon 10s ease-in-out ;
    }
  }
  @keyframes moon {
    0%{
      translate: 100%;
      scale: 1;
    }
    50%{
      translate: 0%;
      scale: .9;
    }
    100%{
      translate: -100%;
      scale: .9;
    }
    
  }
</style>
<body>
  
  <div class="universe">
    <div class="sun"></div>
  </div>
</body>
</html>
