<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>font property</title>
</head>
<style>
  #first{
    font-size: 5px;
    font-weight: 100;
    font-style: italic;

  }
  #second{
    font-size: 10px;
     font-weight: 450;
     font-style: oblique;
  }
  #third{
    font-size: 25px;
     font-weight: 400;
     font-style: normal;
     font-family: 'Arial Narrow', Courier, monospace;
  }
  #fourth{
    font-size:35px;
     font-weight: 900;
     font-style: normal;
  }
</style>
<body>
  <p id="first">Lorem ipsum dolor sit amet.</p>
   <p id="second">Lorem ipsum dolor sit amet.</p>
    <p id="third">Lorem ipsum dolor sit amet.</p>
     <p id="fourth">Lorem ipsum dolor sit amet.</p>
</body>
</html>
