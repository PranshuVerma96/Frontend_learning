<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height and width </title>
  <style>
    *{
      margin: 0px;
      padding: 0px;
    }
    .first{
      height: 60px;
      width: 60px;
     margin: 10px;
    padding: 30px;
    border-radius: 50%;
    
    }
    #first{
      background: rgba(32, 91, 142,.4);
    }
    #first:hover{
      background-color: chocolate;
    }
    #second{
      background: palevioletred;
    }
    #third{
      background: blueviolet;
    }
  </style>
</head>
<body>
  <div id="first" class="first">first</div>
  <div id="second" class="first">Second</div>
  <div id="third" class="first">third</div>
</body>
</html>
