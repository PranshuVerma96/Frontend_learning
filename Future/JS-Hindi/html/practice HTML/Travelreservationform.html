<html lang="en">
<head>

  <title>Travel reservation form</title>
</head>

<body>
 <style>

 </style>
  <main>
    <header>
         <h2>Travel reservation form</h2>
  <h3>*denotes mandotory</h3>
  <form>
    Full name*:<br><input type="text" placeholder="FirstName LastName"><br>
    Email address*:<br><input type="text" placeholder="EMAIL_ADDRESS"><br>
    <label for="country">Select Tour Package* :</label>
    <select name="country" id="country">
    <option value="Goa">Goa</option>
    <option value="India">India</option>
    <option value="America">America</option>
    <option value="Delhi">Delhi</option>
    <option value="Pune">Pune</option>
    <option value="Cheen">cheen</option>
    </select><br>
    Arrival date*: <input type="date" placeholder="m/d/y"><br>
    <h3>What would you want to avail?*</h3>
    <label for="Boarding">Boarding</label>
    <input type="checkbox" id="Boarding" name="fruit" value="Boarding"><br>
<label for="Fooding">Fooding</label>
<input type="checkbox" id="Fooding" value="Fooding"><br>
<label for="Sight seeing">Sight seeing</label>
<input type="checkbox" id="Sight seeing" value="Sight seeing">
<h3>Discount Coupan Code:</h3>
<input type="password" placeholder="UNKNOWN_TYPE"><br>
<h3>Terms and Conditions</h3>
<label for="choice">I agree</label>
<input type="radio" id="I agree" name="choice" value="I agree"><br> 
<label for="choice">I  not agree</label>
<input type="radio" id="I not agree" name="choice" value="I not agree"><br>
<button>Complete reservation</button>

  </form>

    </header>
   
  </main>

</body>
