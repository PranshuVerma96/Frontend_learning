<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document and digital clock</title>
</head>
<style>
  body{
    background-color: #212121;
    color: white;
  }
  .div{
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;


  }
  .clock{
    height: 35px;
    width:120px ;
    background-color: orange;
     display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    color: black;
    border-radius: 3px ;
  }
</style>
<body>
  <div class="div">
    <div class="clock"></div>
  </div>
  
</body>
<script>

  
  const clockData = document.querySelector('.clock');
   
  setInterval(()=>{
      const time = new Date();
   clockData.innerHTML = time.toLocaleTimeString();
  },1000);
  
</script>
</html>
