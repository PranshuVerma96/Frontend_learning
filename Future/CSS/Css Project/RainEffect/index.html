<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain Effect</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      width: 100vw;
      height: 100vh;
      background-image:
        linear-gradient(
          rgba(0,0,0,0.6),
          rgba(0,0,0,0.4)
        ),
        url('https://media.istockphoto.com/id/155440589/photo/eastern-townships-orchard-with-small-house.jpg?s=2048x2048&w=is&k=20&c=XhGSJ4zZU_RT4a7e8eLjcZnobb14FWF0IfvnmIW4plc=');
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .rain{
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: url('https://images.unsplash.com/photo-1434118489318-42a0e62c6235?q=80&w=1374&auto=format&fit=crop');
     
      opacity: 0.3;
      animation: rain 0.5s linear infinite;
    }

    @keyframes rain {
     0%{
        background-position: 0 0;
      }
      100%{
        background-position: 10% 100%;
      }
    }
  </style>
</head>
<body>
  <div class="rain"></div>
</body>
</html>
