<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital clock</title>
</head>
<style>
  body{
    background-color: rgb(54, 53, 53);
   
    overflow: hidden;
  }
  .center{
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .banner{
    font-size: 25px;
    color: green;
  }

  .clock{
    color: black;
    margin-top: 9px;
    text-align: center;
    height: 40px ;
    width: 200px;
    font-weight: bold;
   font-size: x-large;
   background-color: orange;
   border-radius: 9px;
  
  }
</style>
<body>
  
  <div class="center">
    <div class="banner"><span>Your local time </span></div>
    <div class="clock"></div>
  </div>
</body>
<script src="script.js"></script>
</html>
