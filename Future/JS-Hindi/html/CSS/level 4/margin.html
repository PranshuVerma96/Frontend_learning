<html lang="en">
<head>

  <style>
    *{
      margin: 0px;
      padding: 0px;

      #Button{
        height: 50px;
        width: 50px;
        background-color: lightblue;

      padding: 2px;
  }

</head>
<body>
  <button id="Button">Click Me</button>
</body>
</html>
