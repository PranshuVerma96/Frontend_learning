<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator Project</title>
    <style>
      *{
        margin: 0px;
        padding: 0px;
      
      }
     body{
    width: 100%;
    height: vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:blue;
}
      .container {
       
        width: 250px;
        border: 2px solid;
        background-color: rgb(37, 30, 30);
        height: 400px;
        
      }
   
      #display{
  margin: 10px ;
  width: 85%;
  font-size: 30px;
 
  border: none;
}
      .button {
        height: 47px;
        width: 47px;
        margin: 2px;
        font-size: 17px;
        border-radius: 50px;
        border: none;
        background-color: rgb(136, 132, 132);
        color:white;
        text-decoration: none;
      }
      .ButtonContainer{
        justify-content: center;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        
        
      }
      .buttonLast{
            height: 47px;
        width: 47px;
        margin: 2px;
        font-size: 20px;
        border-radius: 50px;
        background-color: rgb(223, 129, 14);
       color: white;
       border: none;
      }
     
    </style>
  </head>
  <body>
    <div id="color">
    <div class="container">
        <input type="text" id="display" readonly  />
      <div class="ButtonContainer">
          <button class="button" onclick="currentDisplay='';document.querySelector('#display').value=currentDisplay;">AC</button>
      <button class="button"  onclick="currentDisplay=(parseFloat(currentDisplay)/100).toString(); document.querySelector('#display').value=currentDisplay;">%</button>
      <button class="button" onclick="currentDisplay=currentDisplay.slice(0,-1); document.querySelector('#display').value=currentDisplay;">DEL</button>

       <button class="button"  onclick="currentDisplay=currentDisplay + '/'; document.querySelector('#display').value=currentDisplay;">/</button>
       
      <button class="button" onclick="currentDisplay=currentDisplay + '7'; document.querySelector('#display').value=currentDisplay;"
        >7</button>
       <button class="button" onclick="currentDisplay=currentDisplay + '8'; document.querySelector('#display').value=currentDisplay;"
      >8</button>
      <button class="button"  onclick="currentDisplay=currentDisplay + '9'; document.querySelector('#display').value=currentDisplay;">9</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '*'; document.querySelector('#display').value=currentDisplay;">*</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '4'; document.querySelector('#display').value=currentDisplay;">4</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '5'; document.querySelector('#display').value=currentDisplay;">5</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '6'; document.querySelector('#display').value=currentDisplay;">6</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '-'; document.querySelector('#display').value=currentDisplay;">-</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '1'; document.querySelector('#display').value=currentDisplay;">1</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '2'; document.querySelector('#display').value=currentDisplay;">2</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '3'; document.querySelector('#display').value=currentDisplay;">3</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '+'; document.querySelector('#display').value=currentDisplay;">+</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '00'; document.querySelector('#display').value=currentDisplay;">00</button>

      <button class="button"  onclick="currentDisplay=currentDisplay + '0'; document.querySelector('#display').value=currentDisplay;">0</button>
      <button class="button"  onclick="
      currentDisplay=currentDisplay + '.'; document.querySelector('#display').value=currentDisplay;">.</button>

      <button class="buttonLast" onclick="
      let result=eval(currentDisplay);
      currentDisplay=result;
       document.querySelector('#display').value=currentDisplay;">=</button>
      </div>
    
    
    </div>
    </div>
    <script>
    let currentDisplay='';
    document.querySelector('#display'.value=currentDisplay);
    </script>
  </body>
</html>
