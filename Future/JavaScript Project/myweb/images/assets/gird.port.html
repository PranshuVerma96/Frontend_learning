
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body{
    font-family: sans-serif;
    font-size: 1.2rem;
  }
  .container{
    min-height: 100vh;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    gap: 20px;
    background: linear-gradient(to right,#041308 ,#0b3317);
  }
  .left-text{
    flex-basis: 30%;
  }
  .gallery{
    flex-basis: 50%;
  }
  .heading{
    font-size: 3rem;
    color: white;
    text-align: center;
  }
  .subheading{
    color: #ddd;
    margin-top: 10px;
    text-align: center;
  }
  .gallery{
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(3,1fr);
    grid-auto-rows: 120px;
  }
  .div{
    background-size: cover;
    background-position: top;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #222;
    background-blend-mode: multiply;
    transition:  all 1s ease-in-out;
    cursor: pointer;
  }
  .row-2{
    grid-row:  span 2;
  }
  .col-2{
    grid-column: span 2 ;
  }
  .div:hover{
      background-color: #999922;
      background-position:center ;
      box-shadow:0,0, 4px rgb(108, 36, 36);
  }
  /* meadia queries*/
  @media screen  and (max-width:1024px){
  .container{
    flex-direction: column;
  }
  .gallery{
    width: 100%;
    padding-inline: 12px;
    grid-auto-rows: 220px;
  }
  .div{
    grid-column: 3 span;
  }
 
    
  }

</style>
<body>
  <div class="container">
    <div class="left-text">
      <h2 class="heading">MY Portfolio</h2>
      <p class="subheading">Lorem ipsum dolor sit amet consectetur adipisicing elit. Distinctio minus delectus asperiores tempore eveniet aliquam autem provident! Ducimus quasi aspernatur aperiam dignissimos ipsum atque laborum vitae explicabo eveniet. Maiores, repellendus?</p>
    </div>
    <div class="gallery">
      <div class="div row-2"id="box1" style="background-image: url(https://images.unsplash.com/photo-1759780763396-505ccfe121ac?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDZ8NnNNVmpUTFNrZVF8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=60&w=1000);" >hello</div>
      <div class="div col-2"style="background-image: url(https://images.unsplash.com/photo-1759780763396-505ccfe121ac?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDZ8NnNNVmpUTFNrZVF8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=60&w=1000);"  >water</div>
      <div class="div" style="background-image: url(https://images.unsplash.com/photo-1759780763396-505ccfe121ac?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDZ8NnNNVmpUTFNrZVF8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=60&w=1000);"  >colo</div>
      <div class="div row-2" style="background-image: url(https://images.unsplash.com/photo-1759780763396-505ccfe121ac?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDZ8NnNNVmpUTFNrZVF8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=60&w=1000);"  >mid</div>
      <div class="div col-2" style="background-image: url(https://images.unsplash.com/photo-1759780763396-505ccfe121ac?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDZ8NnNNVmpUTFNrZVF8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=60&w=1000);" >chai</div>
      <div class="div"style="background-image: url(https://images.unsplash.com/photo-1759780763396-505ccfe121ac?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDZ8NnNNVmpUTFNrZVF8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=60&w=1000);"  >pani</div>
      <div class="div col-2" style="background-image: url(https://images.unsplash.com/photo-1759780763396-505ccfe121ac?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDZ8NnNNVmpUTFNrZVF8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=60&w=1000);" >sam</div>
    </div>
  </div>
</body>
</html>
