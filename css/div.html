<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .container{
    flex-wrap: wrap;
    width: 100%;
    height: 100vh;
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
  }
  /* flex shrink  = 0 when we use logo and button we want this is not shink than we applied it.*/
  .box{
    height: 90px;
    width: 90px;
    background-color: red;
 
  }
  .box2{
    flex-wrap: wrap;
       flex-grow: 1;
       flex-shrink:0;
  }
</style>
<body>
  
  <div class="container">
    <div class="box">1</div>
    <div class="box box2">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </div>
</body>
</html>
