<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myntra bag </title>
<style>
  .btn1{
    background-color: lightgreen;
    border: none;
    padding: 5px 15px;
    border-radius: 10px;
  }
  .btn3{
    padding: 5px 15px ;
    border: 2px solid ;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <button class="btn1" onclick="(cartQuentity+=1)
     document.querySelector('#cart-summary').innerText =`Your bag has ${ cartQuentity}  items`">Add to Bag</button>

  <button class="btn2" onclick="(cartQuentity=cartQuentity-1)
     document.querySelector('#cart-summary').innerText =`Your bag has ${ cartQuentity}  items`">Move to Wishlist</button>

  <button class="btn3" onclick="(cartQuentity=cartQuentity+2)
     document.querySelector('#cart-summary').innerText =`Your bag has ${ cartQuentity}  items`">Add 1+1 sale item</button>
      
  <h1 id="cart-summary"></h1>
  <script>
    let cartQuentity=0;
    document.querySelector('#cart-summary').innerText =`Your bag has ${ cartQuentity}  items`
  </script>
</body>
</html>
