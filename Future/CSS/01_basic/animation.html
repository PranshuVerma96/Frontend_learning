<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document and animation </title>
  <style>
    body{
      background-color: rgb(33, 29, 29);
    }
    .container{
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
    

    }
    .box{
      width:100px;
      aspect-ratio: 1;
     background: linear-gradient(red, green);
        border-radius: 50%;
        box-shadow: 2px 3px 1px ;
        transition: all 2s;
    }
    .box:nth-child(1):hover{
      transition-timing-function: ease;
      translate: 90vh 0;

    }
    .box:nth-child(2):hover{
      transform: translateX(90vw);
      transform: 5s ease-in;
    }

    .box:nth-child(3):hover{
      background-color: aqua;
      transform: translateX(90vw);
      transition: 5s linear;
    }
  </style>
</head>
<body>
  
  <div class="container">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>
</body>
</html>
