<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice exercise</title>
  <style>
    #my-button{
      height: 50px;

      width: 50px;
      font-size: 25px;

    }
    .odd{
      background-color: pink;
    }
    .even{
      background-color: red;
    }
  </style>
</head>
<body>
  <h3 id="greeting"></h3>
  <button id ="my-button" onclick="buttonPresed();">0</button>
  <script>
let noofTime=0;
function buttonPresed(){
  let button=document.querySelector('#my-button');
  button.innerText=noofTime;
  noofTime++;
  if(noofTime%2==0){
button.classList.remove('odd');
button.classList.add('even');
  }else{
button.classList.remove('even');
button.classList.add('odd');
  }
 
}

  </script>
