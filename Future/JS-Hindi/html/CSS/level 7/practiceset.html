<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation</title>
  <style>
    #progress{
      height: 20px;
      width: 90%;
      background-color: gainsboro;
      border: 2px solid black;
      border-radius: 10px;
      position: relative
      ;
      left: 4%;
    }
    #bar{
      background-color: aqua;
      height: 100%;
      
      border-radius: 20px;
     animation: pro 3s;
    }
    @keyframes pro {
        0%{width: 0%;}
        90%{width: 95%;}
        95%{width: 70%;}
        100%{width: 100%;}
        
      
    }
  </style>
</head>
<body>
  <div id="progress">
    <div id="bar"></div>
  </div>
</body>
</html>
